name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -r dist/windows-exe-recon.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "ci/*" \
            -x "download/*" \
            -x "dist/*" \
            -x "*.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/windows-exe-recon.zip \
            --title "Windows EXE Recon ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --latest
