<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Windows EXE Recon</title>
  <desc id="desc">A demo/reference OpenCode skill for authorized Windows executable analysis and clean-room behavior mapping.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.55" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ce1ff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5ce1ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#5ce1ff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Magnifying glass -->
  <g transform="translate(150 150)">
    <circle r="72" fill="url(#lens)" stroke="#5ce1ff" stroke-opacity="0.85" stroke-width="4"/>
    <circle r="56" fill="none" stroke="#5ce1ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="0" y="-8" text-anchor="middle" fill="#5ce1ff" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">01</text>
    <text x="0" y="18" text-anchor="middle" fill="#8fb3c9" font-family="Consolas, 'Courier New', monospace" font-size="13">10</text>
    <line x1="50" y1="50" x2="102" y2="102" stroke="#ffd27a" stroke-width="14" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="102" y2="102" stroke="#ffb84d" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title block -->
  <text x="310" y="112" fill="#e6f7ff" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="700" letter-spacing="2">WINDOWS EXE RECON</text>
  <text x="312" y="154" fill="#8fb3c9" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="1.5">AUTHORIZED ANALYSIS · CLEAN-ROOM BEHAVIOR MAPPING</text>

  <!-- Demo badge -->
  <g transform="translate(312 184)">
    <rect width="252" height="34" rx="17" fill="#ff6b6b" fill-opacity="0.10" stroke="#ff6b6b" stroke-opacity="0.65"/>
    <circle cx="18" cy="17" r="4" fill="#ff6b6b"/>
    <text x="32" y="22" fill="#ffb3b3" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">DEMO / REFERENCE WORKFLOW</text>
  </g>

  <!-- Bottom line -->
  <text x="312" y="258" fill="#637f95" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1">STATIC TRIAGE · GHIDRA · VM DYNAMICS · EVIDENCE · REPORT</text>
  <text x="1120" y="258" text-anchor="end" fill="#637f95" font-family="Consolas, 'Courier New', monospace" font-size="13">MIT · NO WARRANTY</text>
</svg>
